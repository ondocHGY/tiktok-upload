version: "3.8"

services:
  backend:
    build: .
    restart: always
    environment:
      - TT_CLIENT_KEY=${TT_CLIENT_KEY}
      - TT_CLIENT_SECRET=${TT_CLIENT_SECRET}
      - TT_REDIRECT_URI=${TT_REDIRECT_URI}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-tiktok_upload}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - VIDEO_DIR=/app/videos
      - AUDIO_DIR=/app/audios
      - FRONTEND_URL=${FRONTEND_URL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./videos:/app/videos
      - ./audios:/app/audios

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3010:3000"
    depends_on:
      - backend
